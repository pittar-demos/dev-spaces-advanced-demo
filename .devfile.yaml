schemaVersion: 2.2.2
metadata:
  name: "devspaces"
  provider: Red Hat
  displayName: Dev Spaces Demo
  description: Dev Spaces Demo
  tags:
    - DevSpaces
    - Podman
    - Demo
  projectType: RHDH
  language: YAML
components:
  - name: tools
    container:
      image: quay.io/pittar/custom-udi-demo:latest
      args: ['tail', '-f', '/dev/null']
      mountSources: true
      cpuLimit: '4'
      cpuRequest: '500m'
      memoryLimit: '8G'
      memoryRequest: '2G'
commands:
  - id: configure-opencode
    exec:
      component: tools
      commandLine: "mkdir -p /home/user/.config/opencode && cp /data/opencode/*.* /home/user/.config/opencode/"
events:
  postStart:
    - configure-opencode
