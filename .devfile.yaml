schemaVersion: 2.2.2
attributes:
  controller.devfile.io/storage-type: per-workspace
metadata:
  name: "devspaces"
  provider: Red Hat
  displayName: Dev Spaces Demo
  description: Dev Spaces Demo
  tags:
    - DevSpaces
    - Podman
    - Demo
  projectType: RHDH
  language: YAML
components:
  - name: tools
    container:
      image: quay.io/pittar/custom-udi-demo:latest
      args: ['tail', '-f', '/dev/null']
      mountSources: true
      cpuLimit: '4'
      cpuRequest: '500m'
      memoryLimit: '8G'
      memoryRequest: '2G'
commands:
  - id: configure-tooling
    exec:
      component: tools
      workingDir: ${PROJECT_SOURCE}
      label: Configure OpenCode
      commandLine: |
        set -euo pipefail
        mkdir -p "$TOOLS_HOME/bin" "$HOME/.local/bin"

        # Copy opencode config, if this environment provides one.
        if [ -d /data/opencode ]; then
          mkdir -p "$HOME/.config/opencode"
          cp /data/opencode/*.* "$HOME/.config/opencode/" 2>/dev/null || true
        fi

        echo "==> Ready:"
